<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AnatomyAtlas 3D – Organs, Conditions &amp; Treatment</title>
<style>
:root{--bg:#0b1220;--panel:#121b2e;--panel2:#18243d;--ink:#e8eefc;--mute:#92a1c0;--acc:#4fd1c5;--warn:#f6ad55;--bad:#fc8181;--ok:#68d391;--line:#243252}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;flex:1;letter-spacing:.2px}
header h1 span{color:var(--acc)}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer}
.btn.on{background:var(--acc);color:#04201d;border-color:var(--acc);font-weight:600}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:12px;cursor:pointer;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
#stage{flex:1;position:relative;min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hint{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12px;color:var(--mute);pointer-events:none}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:56%;background:var(--panel);border-top:2px solid var(--acc);border-radius:16px 16px 0 0;overflow-y:auto;transform:translateY(105%);transition:transform .25s;padding:12px 14px 22px;box-shadow:0 -8px 30px #0008}
#sheet.open{transform:none}
#sheet h2{margin:0 28px 2px 0;font-size:18px}
#sheet .sub{color:var(--mute);font-size:12.5px;line-height:1.45;margin:3px 0}
#close{position:absolute;right:10px;top:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:16px;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
.tab{padding:5px 10px;border-radius:8px;font-size:12.5px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;color:var(--ink)}
.tab.on{background:var(--acc);color:#04201d;font-weight:600;border-color:var(--acc)}
.cond{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.cond h3{margin:0 0 4px;font-size:15px;color:var(--acc)}
.blk{margin-top:8px}
.blk b{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.blk.a b{color:#90cdf4}.blk.s b{color:var(--warn)}.blk.t b{color:var(--ok)}.blk.m b{color:#d6bcfa}.blk.r b{color:var(--bad)}
.blk div,.blk li{font-size:13px;line-height:1.45}
.blk ul{margin:0;padding-left:18px}
.disc{font-size:11px;color:var(--mute);margin-top:12px;border-top:1px dashed var(--line);padding-top:8px;line-height:1.4}
#search{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Anatomy<span>Atlas</span> 3D</h1>
    <button class="btn on" id="bShell">Body</button>

    <button class="btn" id="bSpin">Spin</button>
    <button class="btn" id="bReset">Reset</button>
  </header>
  <div id="chips"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">Drag to rotate · pinch/scroll to zoom · tap an organ</div>
    <div id="sheet"><button id="close" aria-label="Close">✕</button><div id="sheetBody"></div></div>
  </div>
</div>

function lat(nu,nv,fn){ // parametric sphere-like surface
  const v=[],t=[];
  for(let j=0;j<=nv;j++)for(let i=0;i<nu;i++)v.push(fn(i/nu*2*PI,j/nv*PI));
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){
    const a=j*nu+i,b=j*nu+(i+1)%nu,c=(j+1)*nu+i,d=(j+1)*nu+(i+1)%nu;
    t.push([a,c,b],[b,c,d]);
  }
  return {v,t};
}
function ellipsoid(c,r,o={}){
  const nu=o.nu||20,nv=o.nv||14,tilt=o.tilt||0,ct=Math.cos(tilt),st=Math.sin(tilt);
  return lat(nu,nv,(th,ph)=>{
    let ux=Math.sin(ph)*Math.cos(th),uy=Math.cos(ph),uz=Math.sin(ph)*Math.sin(th);
    const k=o.shape?o.shape(ux,uy,uz,th,ph):1;
    let x=ux*r[0]*k,y=uy*r[1]*k,z=uz*r[2]*k;
    const x2=x*ct-y*st,y2=x*st+y*ct;
    return [x2+c[0],y2+c[1],z+c[2]];
  });
}
function spline(p,n){
  const out=[];
  for(let i=0;i<p.length-1;i++){
    const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];
    for(let s=0;s<n;s++){
      const t=s/n,t2=t*t,t3=t2*t;
      out.push([0,1,2].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)));
    }
  }
  out.push(p[p.length-1]);
  return out;
}
function tube(pts,r,seg=7){
  const v=[],t=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
    let tx=b[0]-a[0],ty=b[1]-a[1],tz=b[2]-a[2];const L=Math.hypot(tx,ty,tz)||1;tx/=L;ty/=L;tz/=L;
    let ux=0,uy=0,uz=1;if(Math.abs(tz)>.9){ux=1;uz=0}
    let nx=ty*uz-tz*uy,ny=tz*ux-tx*uz,nz=tx*uy-ty*ux;const N=Math.hypot(nx,ny,nz)||1;nx/=N;ny/=N;nz/=N;
    const bx=ty*nz-tz*ny,by=tz*nx-tx*nz,bz=tx*ny-ty*nx;
    const rr=typeof r==='function'?r(i/(pts.length-1)):r;
    for(let s=0;s<seg;s++){
      const a2=s/seg*2*PI,c=Math.cos(a2)*rr,d=Math.sin(a2)*rr;
      v.push([pts[i][0]+nx*c+bx*d,pts[i][1]+ny*c+by*d,pts[i][2]+nz*c+bz*d]);
    }
  }
  for(let i=0;i<pts.length-1;i++)for(let s=0;s<seg;s++){
    const a=i*seg+s,b=i*seg+(s+1)%seg,c=(i+1)*seg+s,d=(i+1)*seg+(s+1)%seg;
    t.push([a,c,b],[b,c,d]);
  }
  return {v,t};
}
const lumpy=(f,a,b)=>(x,y,z)=>1+f*Math.sin(a*Math.atan2(z,x)+1)*Math.sin(b*Math.acos(y));

/* ---- build organs (patient left = +x on screen, viewer sees front from +z) ---- */
const PARTS=[]; // {organ,mesh,color,alpha}
function add(organ,mesh,color,alpha){PARTS.push({organ,mesh,color:color||ORGANS[organ]&&ORGANS[organ].color,alpha:alpha||.95});}

add("brain",ellipsoid([0,1.79,-.01],[.15,.115,.17],{nu:26,nv:16,shape:lumpy(.07,9,10)}));
add("thyroid",ellipsoid([-.035,1.42,.075],[.035,.04,.02],{tilt:.35}));
add("thyroid",ellipsoid([.035,1.42,.075],[.035,.04,.02],{tilt:-.35}));
// trachea + bronchi (part of lungs)
add("lungs",tube([[0,1.5,.06],[0,1.32,.055],[0,1.17,.05]],.024,8),"#f7c6cb");
add("lungs",tube([[0,1.17,.05],[-.06,1.1,.05],[-.12,1.05,.04]],.016,6),"#f7c6cb");
add("lungs",tube([[0,1.17,.05],[.06,1.1,.05],[.12,1.05,.04]],.016,6),"#f7c6cb");
add("lungs",ellipsoid([-.2,1.0,0],[.14,.3,.14],{nu:22,nv:14,shape:(x,y,z)=>x>.2?.8:1}));
add("lungs",ellipsoid([.2,1.0,0],[.14,.3,.14],{nu:22,nv:14,shape:(x,y,z)=>x<-.2?.8:1}));
// heart + great vessels
add("heart",ellipsoid([.07,.95,.06],[.1,.13,.085],{tilt:-.55,nu:20,nv:14}));
add("heart",tube([[.0,1.04,.04],[-.01,1.2,.05],[.04,1.28,.02],[.12,1.2,-.04],[.14,1.0,-.08],[.14,.7,-.1],[.13,.4,-.1],[.12,.15,-.08]],.032,8),"#c53030");
add("heart",tube([[-.05,1.05,.04],[-.06,1.25,.04],[-.06,1.45,.03]],.022,7),"#3182ce"); // SVC (blue)
// liver
add("liver",ellipsoid([-.14,.66,.04],[.25,.1,.14],{tilt:.12,nu:22,nv:12,shape:(x,y,z)=>y>0?1:.9}));
// stomach
add("stomach",ellipsoid([.14,.66,.05],[.13,.1,.08],{tilt:-.7,nu:20,nv:12}));
add("stomach",tube([[.02,.95,.0],[.04,.82,.0],[.08,.72,.03]],.018,7),"#ed8936"); // oesophagus end
// spleen
add("spleen",ellipsoid([.29,.62,-.07],[.05,.1,.06],{tilt:.2}));
// pancreas
add("pancreas",tube(spline([[-.08,.52,.02],[-.01,.54,.02],[.08,.56,.0],[.18,.6,-.04],[.25,.62,-.06]],6),.026,8));
// kidneys (posterior)
add("kidneys",ellipsoid([-.17,.5,-.13],[.05,.09,.04],{nu:16,nv:12}));
add("kidneys",ellipsoid([.17,.5,-.13],[.05,.09,.04],{nu:16,nv:12}));
add("kidneys",tube([[-.14,.46,-.12],[-.1,.3,-.08],[-.03,.1,-.02]],.008,5),"#f6e05e");
add("kidneys",tube([[.14,.46,-.12],[.1,.3,-.08],[.03,.1,-.02]],.008,5),"#f6e05e");
// small intestine – serpentine
(function(){
  const w=[];const rows=7;
  for(let i=0;i<rows;i++){const y=.4-i*.045,z=.05+.015*Math.sin(i);
    if(i%2===0){w.push([-.16,y,z],[.16,y,z])}else{w.push([.16,y,z],[-.16,y,z])}}
  add("intestine",tube(spline(w,7),.026,7),"#f0a2b4");
})();
// large intestine – frame
add("intestine",tube(spline([[-.21,.1,.03],[-.22,.25,.03],[-.22,.43,.03],[-.12,.45,.06],[0,.41,.07],[.12,.45,.06],[.22,.43,.03],[.22,.25,.03],[.2,.12,.02],[.1,.07,.02],[0,.04,-.01],[0,-.02,-.04]],6),.034,8),"#c0486a");
// appendix hint
add("intestine",tube([[-.21,.09,.04],[-.18,.04,.06],[-.15,.02,.06]],.01,5),"#8b2d49");
// bladder
add("bladder",ellipsoid([0,-.06,0],[.075,.065,.07],{nu:18,nv:12}));
// body shell (head + torso + neck + limbs hint)
const SHELL=[];
SHELL.push(ellipsoid([0,1.78,0],[.2,.24,.21],{nu:22,nv:14}));
SHELL.push(tube([[0,1.6,0],[0,1.4,0]],.1,12));
SHELL.push(ellipsoid([0,.62,0],[.43,.88,.24],{nu:26,nv:18,shape:(x,y,z)=>y>.55?1-.08*Math.pow(y-.55,2):1}));
SHELL.push(tube([[-.43,1.3,0],[-.62,.9,0],[-.7,.35,.02],[-.72,-.05,.04]],.065,10));
SHELL.push(tube([[.43,1.3,0],[.62,.9,0],[.7,.35,.02],[.72,-.05,.04]],.065,10));
SHELL.push(tube([[-.16,-.2,0],[-.18,-.9,0],[-.18,-1.6,0]],.11,10));
SHELL.push(tube([[.16,-.2,0],[.18,-.9,0],[.18,-1.6,0]],.11,10));

/* flatten everything into typed arrays */
let VERTS=[],TRIS=[];
function pushMesh(m,organ,color,alpha,isShell){
  const base=VERTS.length;
  m.v.forEach(p=>VERTS.push(p));
  const rgb=hex(color||"#8899aa");
  m.t.forEach(t=>TRIS.push({a:base+t[0],b:base+t[1],c:base+t[2],organ,rgb,alpha,shell:!!isShell,z:0}));
}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
PARTS.forEach(p=>pushMesh(p.mesh,p.organ,p.color,p.alpha,false));
SHELL.forEach(m=>pushMesh(m,"shell","#6fa8dc",.07,true));
const NV=VERTS.length;
const P3=new Float32Array(NV*3),P2=new Float32Array(NV*2);
const CENTERS={};
(function(){
  const acc={};
  PARTS.forEach(p=>{const o=p.organ;acc[o]=acc[o]||{s:[0,0,0],n:0};p.mesh.v.forEach(q=>{acc[o].s[0]+=q[0];acc[o].s[1]+=q[1];acc[o].s[2]+=q[2];acc[o].n++})});
  for(const k in acc)CENTERS[k]=acc[k].s.map(v=>v/acc[k].n);
  CENTERS.intestine=[0,.25,.05];CENTERS.kidneys=[.0,.5,-.13];CENTERS.lungs=[0,1.0,0];
})();

/* ============================== RENDERER ============================== */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;
const view={yaw:0,pitch:.05,zoom:1,spin:false,shell:true,labels:true};
let selected=null,activeCond=0,hoverDown=null;
const LIGHT=norm([.4,.6,1]);
function norm(v){const l=Math.hypot(...v);return v.map(x=>x/l)}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cv.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);

const CAM=4.2;
let lastDrawn=[],shiftY=0,shiftT=0;
function project(){
  const cy=Math.cos(view.yaw),sy=Math.sin(view.yaw),cp=Math.cos(view.pitch),sp=Math.sin(view.pitch);
  const base=Math.min(W/1.9,H/4.1)*view.zoom; // fit full body
  const ox=W/2,oy=H/2+base*.12+shiftY;
  for(let i=0;i<NV;i++){
    const p=VERTS[i];
    const x1=p[0]*cy+p[2]*sy,z1=-p[0]*sy+p[2]*cy;
    const y2=(p[1]-.1)*cp-z1*sp,z2=(p[1]-.1)*sp+z1*cp;
    P3[i*3]=x1;P3[i*3+1]=y2;P3[i*3+2]=z2;
    const k=CAM/(CAM-z2);
    P2[i*2]=ox+x1*base*k;P2[i*2+1]=oy-y2*base*k;
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  project();
  const list=[];
  for(const t of TRIS){
    if(t.shell&&!view.shell)continue;
    t.z=(P3[t.a*3+2]+P3[t.b*3+2]+P3[t.c*3+2])/3;
    list.push(t);
  }
  list.sort((p,q)=>p.z-q.z);
  lastDrawn=list;
  for(const t of list){
    const ax=P2[t.a*2],ay=P2[t.a*2+1],bx=P2[t.b*2],by=P2[t.b*2+1],cx=P2[t.c*2],cy=P2[t.c*2+1];
    if(t.shell){
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineTo(cx,cy);ctx.closePath();
      ctx.fillStyle="rgba(111,168,220,.045)";ctx.fill();
      ctx.strokeStyle="rgba(140,190,240,.10)";ctx.lineWidth=.5;ctx.stroke();
      continue;
    }
    // normal for shading (view space)
    const ux=P3[t.b*3]-P3[t.a*3],uy=P3[t.b*3+1]-P3[t.a*3+1],uz=P3[t.b*3+2]-P3[t.a*3+2];
    const vx=P3[t.c*3]-P3[t.a*3],vy=P3[t.c*3+1]-P3[t.a*3+1],vz=P3[t.c*3+2]-P3[t.a*3+2];
    let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;const L=Math.hypot(nx,ny,nz)||1;
    const d=Math.abs((nx*LIGHT[0]+ny*LIGHT[1]+nz*LIGHT[2])/L);
    let sh=.42+.62*d,a=t.alpha;
    let [r,g,b]=t.rgb;
    if(selected){
      if(t.organ===selected){sh+=.1;r=Math.min(255,r+25);g=Math.min(255,g+25);b=Math.min(255,b+25);a=1}
      else a=.22;
    }
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineTo(cx,cy);ctx.closePath();
    const col=`rgba(${Math.min(255,r*sh)|0},${Math.min(255,g*sh)|0},${Math.min(255,b*sh)|0},${a})`;
    ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=.6;ctx.stroke(); // hides seams
  }
  if(view.labels)drawLabels();
}
function projC(c){
  const cy=Math.cos(view.yaw),sy=Math.sin(view.yaw),cp=Math.cos(view.pitch),sp=Math.sin(view.pitch);
  const base=Math.min(W/1.9,H/4.1)*view.zoom,ox=W/2,oy=H/2+base*.12+shiftY;
  const x1=c[0]*cy+c[2]*sy,z1=-c[0]*sy+c[2]*cy,y2=(c[1]-.1)*cp-z1*sp,z2=(c[1]-.1)*sp+z1*cp,k=CAM/(CAM-z2);
  return [ox+x1*base*k,oy-y2*base*k,z2];
}
const SHORT={brain:"Brain",thyroid:"Thyroid",lungs:"Lungs",heart:"Heart",liver:"Liver",stomach:"Stomach",spleen:"Spleen",pancreas:"Pancreas",kidneys:"Kidneys",intestine:"Intestines",bladder:"Bladder"};
function drawLabels(){
  ctx.font="600 11px system-ui,sans-serif";ctx.textBaseline="middle";
  for(const id in ORGANS){
    const p=projC(CENTERS[id]);
    if(p[2]<-.15&&selected!==id)continue; // behind body: hide unless selected
    if(selected&&selected!==id)continue;
    const txt=SHORT[id];
    const w=ctx.measureText(txt).width;
    const on=selected===id;
    ctx.fillStyle=on?"rgba(79,209,197,.95)":"rgba(10,16,30,.62)";
    ctx.fillRect(p[0]-w/2-4,p[1]-8,w+8,16);
    ctx.fillStyle=on?"#04201d":"#e8eefc";
    ctx.fillText(txt,p[0]-w/2,p[1]);
  }
}
function pick(px,py){
  for(let i=lastDrawn.length-1;i>=0;i--){
    const t=lastDrawn[i];if(t.shell)continue;
    const ax=P2[t.a*2],ay=P2[t.a*2+1],bx=P2[t.b*2],by=P2[t.b*2+1],cx=P2[t.c*2],cy=P2[t.c*2+1];
    const d=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);if(Math.abs(d)<1e-6)continue;
    const l1=((by-cy)*(px-cx)+(cx-bx)*(py-cy))/d,l2=((cy-ay)*(px-cx)+(ax-cx)*(py-cy))/d,l3=1-l1-l2;
    if(l1>=0&&l2>=0&&l3>=0)return t.organ;
  }
  return null;
}

/* ============================== INTERACTION ============================== */
const ptrs=new Map();let pinch0=0,zoom0=1,moved=0,downPos=null;
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=0;downPos={x:e.clientX,y:e.clientY};}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=view.zoom;}
});
cv.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){view.yaw+=dx*.009;view.pitch=Math.max(-1.2,Math.min(1.2,view.pitch+dy*.007));moved+=Math.abs(dx)+Math.abs(dy);}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);view.zoom=Math.max(.5,Math.min(4,zoom0*d/pinch0));moved+=10;}
});
function up(e){
  const wasOne=ptrs.size===1;ptrs.delete(e.pointerId);
  if(wasOne&&moved<6&&downPos){
    const r=cv.getBoundingClientRect(),o=pick(e.clientX-r.left,e.clientY-r.top);
    if(o)select(o);else if(selected)deselect();
  }
}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",e=>ptrs.delete(e.pointerId));
cv.addEventListener("wheel",e=>{e.preventDefault();view.zoom=Math.max(.5,Math.min(4,view.zoom*(e.deltaY<0?1.1:.91)))},{passive:false});

/* ============================== UI ============================== */
const chips=document.getElementById("chips"),sheet=document.getElementById("sheet"),sb=document.getElementById("sheetBody");
for(const id in ORGANS){
  const c=document.createElement("button");c.className="chip";c.dataset.id=id;
  c.innerHTML=`<i style="background:${ORGANS[id].color}"></i>${ORGANS[id].name.split(" ")[0]}`;
  c.onclick=()=>select(id);chips.appendChild(c);
}
function select(id){
  selected=id;activeCond=0;
  [...chips.children].forEach(c=>c.classList.toggle("sel",c.dataset.id===id));
  const sel=chips.querySelector(".sel");if(sel)sel.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  // rotate toward front/back as needed for kidneys (posterior)
  if(id==="kidneys"||id==="spleen"){targetYaw=(id==="kidneys")?PI*.85:view.yaw;}
  renderSheet();sheet.classList.add("open");
}
let targetYaw=null;
function deselect(){selected=null;[...chips.children].forEach(c=>c.classList.remove("sel"));sheet.classList.remove("open")}
document.getElementById("close").onclick=deselect;
function li(a){return a.map(x=>`<li>${x}</li>`).join("")}
function renderSheet(){
  const o=ORGANS[selected];
  const c=o.conditions[activeCond];
  sb.innerHTML=`
   <h2 style="color:${o.color}">${o.name}</h2>
   <div class="sub"><b>Location:</b> ${o.location}</div>
   <div class="sub"><b>Function:</b> ${o.function}</div>
   <div class="tabs">${o.conditions.map((x,i)=>`<button class="tab ${i===activeCond?"on":""}" data-i="${i}">${x.name.split("(")[0].trim()}</button>`).join("")}</div>
   <div class="cond">
     <h3>${c.name}</h3>
     <div class="blk a"><b>Where it affects</b><div>${c.affects}</div></div>
     <div class="blk s"><b>Signs &amp; symptoms</b><ul>${li(c.signs)}</ul></div>
     ${c.red?`<div class="blk r"><b>Red flag</b><div>${c.red}</div></div>`:""}
     <div class="blk t"><b>Treatment</b><ul>${li(c.treat)}</ul></div>
     <div class="blk m"><b>Medication</b><ul>${li(c.meds)}</ul></div>
   </div>
   <div class="disc">Educational summary for students; not a substitute for clinical judgement or local guidelines (e.g. Kenya Essential Medicines List / MoH protocols). Doses are intentionally omitted – check current guidelines and the patient's allergies, pregnancy, renal/hepatic function and interactions.</div>`;
  sb.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{activeCond=+b.dataset.i;renderSheet()});
  sheet.scrollTop=0;
}
const tog=(id,key)=>{const b=document.getElementById(id);b.onclick=()=>{view[key]=!view[key];b.classList.toggle("on",view[key])}};
tog("bShell","shell");tog("bLabels","labels");tog("bSpin","spin");
document.getElementById("bReset").onclick=()=>{view.yaw=0;view.pitch=.05;view.zoom=1;targetYaw=0;};

/* ============================== LOOP ============================== */
function frame(){
  shiftT=selected?-H*.2:0;shiftY+=(shiftT-shiftY)*.15;
  if(view.spin&&!ptrs.size)view.yaw+=.006;
  if(targetYaw!==null){const d=targetYaw-view.yaw;if(Math.abs(d)<.01){view.yaw=targetYaw;targetYaw=null}else view.yaw+=d*.12}
  draw();requestAnimationFrame(frame);
}
resize();frame();
new ResizeObserver(resize).observe(document.getElementById("stage"));
</script>
